project_id = "noctis"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5180"
additional_redirect_urls = ["http://127.0.0.1:5180/auth/callback", "http://127.0.0.1:5180/auth/recovery"]
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.shared-cover]
verify_jwt = false
